name: Release

# Pushing a version tag builds the unsigned macOS DMGs and publishes them as a GitHub
# release. Packaging needs macOS (hdiutil for the DMG); CI stays on Ubuntu for everything
# else. The release notes are the version's section of CHANGELOG.md.
#
# Run it by hand (Actions → Release → Run workflow) to rebuild or republish an existing
# tag. The tag itself has to be pushed by a person: the workflow token is refused any ref
# whose commit adds or changes a workflow file, so it cannot create release tags reliably.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (must match a CHANGELOG.md section)'
        required: true
      commit:
        description: 'Commit to build; empty means the head of this ref. The tag v<version> must already exist on it.'
        required: false
        default: ''

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  TARGET: ${{ github.event_name == 'push' && github.sha || (inputs.commit || github.sha) }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --publish never: electron-builder would otherwise try to publish the tag build itself.
      - run: npx electron-builder --mac --publish never
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $version" >&2; exit 1; fi
          printf '\nFull notes in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md). Unsigned build: right-click, then Open the first time.\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
      # The release step would otherwise try to create the tag, which the workflow token
      # is refused when the commit touches a workflow file. Fail early with a plain message.
      - name: Check the tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG does not exist. Push it first: git tag -a $TAG $TARGET -m 'Session Manager $TAG' && git push origin $TAG" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.TARGET }}
          name: Session Manager ${{ env.TAG }}
          body_path: notes.md
          files: dist/*.dmg
          fail_on_unmatched_files: true

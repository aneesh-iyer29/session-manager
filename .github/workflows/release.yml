name: Release

# Pushing a version tag builds the unsigned macOS DMGs and publishes them as a GitHub
# release. Packaging needs macOS (hdiutil for the DMG); CI stays on Ubuntu for everything
# else. The release notes are the tag's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --publish never: electron-builder would otherwise try to publish the tag build itself.
      - run: npx electron-builder --mac --publish never
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $version" >&2; exit 1; fi
          printf '\nFull notes in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md). Unsigned build: right-click, then Open the first time.\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Session Manager ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.dmg
          fail_on_unmatched_files: true

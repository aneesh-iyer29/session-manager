name: CI

# Runs on pull requests and on pushes to main that touch code or config. Docs-only
# pushes and release tags are skipped so the inbox only hears about real failures.
on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Ubuntu: the tests are hermetic (temp dirs, injected exec/fetch, platform passed in),
    # so nothing here needs a macOS runner. Packaging and the headless smoke launch stay
    # local (`npm run dist`, `npm run smoke`), where the real Keychain and menu bar exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

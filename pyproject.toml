[project]
name = "claude-swapper"
version = "0.1.0"
description = "Multi-account usage dashboard and auto-swapper for Claude Code, with a read-only Codex quota view"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aneesh Iyer" }]
keywords = ["claude", "claude-code", "codex", "account-switcher", "usage", "menu-bar"]
dependencies = []

[project.optional-dependencies]
menubar = ["rumps>=0.4.0; sys_platform == 'darwin'"]

[project.scripts]
claude-swapper = "claude_swapper.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_swapper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

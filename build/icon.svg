<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Session Manager app icon: the code-bracket mark (a cyan "<", a white slash, an
       amber ">") on a night-blue tile with a faint grid. The tile is the macOS icon
       shape (824 px on a 1024 canvas, 185 px corners) so it sits level with the
       system's own icons in the Dock. Each bracket arm is its own parallelogram with
       its own gradient, so the fold at the vertex reads as a seam of two tones. -->
  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <linearGradient id="cyanUp" gradientUnits="userSpaceOnUse" x1="393" y1="60" x2="74" y2="380">
      <stop offset="0" stop-color="#1d8fe9"/>
      <stop offset="1" stop-color="#00e8d8"/>
    </linearGradient>
    <linearGradient id="cyanDown" gradientUnits="userSpaceOnUse" x1="74" y1="380" x2="294" y2="590">
      <stop offset="0" stop-color="#1d8fe9"/>
      <stop offset="1" stop-color="#00e8d8"/>
    </linearGradient>
    <linearGradient id="amberUp" gradientUnits="userSpaceOnUse" x1="820" y1="210" x2="990" y2="380">
      <stop offset="0" stop-color="#fbbf2f"/>
      <stop offset="1" stop-color="#f68a2c"/>
    </linearGradient>
    <linearGradient id="amberDown" gradientUnits="userSpaceOnUse" x1="990" y1="380" x2="670" y2="700">
      <stop offset="0" stop-color="#fbd33a"/>
      <stop offset="1" stop-color="#f57f29"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="#181d2b"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
  </g>

  <!-- Mark geometry: 45° arms, band 104 wide (147 across a horizontal cut), drawn in a
       1063 × 640 box (y 60 to 700) and scaled to 648 px wide, centred on the tile. -->
  <g transform="translate(188 317) scale(0.61) translate(0 -60)" stroke-linejoin="round" stroke-width="18">
    <!-- cyan "<", upper arm: flat top with a large rounded outer corner -->
    <path fill="url(#cyanUp)" stroke="url(#cyanUp)"
          d="M0 380 L320 60 L423 60 A44 44 0 0 1 467 104 L467 104 L147 380 Z"/>
    <!-- cyan "<", lower arm: cut square by the slash's left edge -->
    <path fill="url(#cyanDown)" stroke="url(#cyanDown)"
          d="M0 380 L147 380 L331 554 L257.5 627.5 Z"/>
    <!-- amber ">", upper arm: cut square by the slash's right edge -->
    <path fill="url(#amberUp)" stroke="url(#amberUp)"
          d="M1063 380 L916 380 L784 248 L857.5 174.5 Z"/>
    <!-- amber ">", lower arm: flat bottom with a large rounded outer corner -->
    <path fill="url(#amberDown)" stroke="url(#amberDown)"
          d="M1063 380 L743 700 L640 700 A44 44 0 0 1 596 656 L916 380 Z"/>
    <!-- the slash, over both brackets -->
    <path fill="#f6f7fb" stroke="#f6f7fb" d="M185 700 L825 60 L972 60 L332 700 Z"/>
  </g>
</svg>
